# What is extracted, per category. Change this file when the dataset fixes the exact list of fields.
#
# title:      the name Russian cards and datasets use (matched against them)
# label:      the English name the interface shows
# kind:       how a value is found and normalized (app/models/extraction/kinds)
# seller_keys names a seller gives the attribute; matched after lowercasing
# threshold:  values below it go to manual review
# ask_model:  always — ask the model even when the card does not name the attribute (names: brand, model)
# cues:       words that show the card speaks of the attribute, besides its title, seller keys and units;
#             the model is asked about an attribute only when one of them is in the card

defaults:
  threshold: 0.8

categories:
  smartphone:
    title: Смартфон
    label: Smartphone
    keywords: [смартфон, смартфоны, телефон, мобильный телефон, iphone, айфон, galaxy, redmi, poco, pixel]
    attributes: [brand, model, storage, ram, screen_diagonal, battery, color, cpu, resolution, screen_type, refresh_rate]
  laptop:
    title: Ноутбук
    label: Laptop
    keywords: [ноутбук, ультрабук, нетбук, macbook, laptop, galaxy book, redmi book]
    attributes: [brand, model, cpu, ram, storage, screen_diagonal, color, resolution, screen_type]
  tablet:
    title: Планшет
    label: Tablet
    keywords: [планшет, ipad, tablet, galaxy tab, redmi pad, xiaomi pad, matepad]
    attributes: [brand, model, storage, ram, screen_diagonal, battery, color, resolution, screen_type, refresh_rate]
  tv:
    title: Телевизор
    label: TV
    keywords: [телевизор, smart tv, смарт тв]
    attributes: [brand, model, screen_diagonal, resolution, color, refresh_rate, screen_type, power]
  monitor:
    title: Монитор
    label: Monitor
    keywords: [монитор, monitor]
    attributes: [brand, model, screen_diagonal, resolution, refresh_rate, screen_type, color, power]
  smartwatch:
    title: Умные часы
    label: Smartwatch
    keywords: [умные часы, смарт-часы, смарт часы, smart watch, smartwatch, фитнес-браслет, фитнес браслет]
    attributes: [brand, model, screen_diagonal, battery, color]
  headphones:
    title: Наушники
    label: Headphones
    keywords: [наушники, гарнитура, headphones, earbuds]
    attributes: [brand, model, connection, color]
  refrigerator:
    title: Холодильник
    label: Refrigerator
    keywords: [холодильник, морозильник]
    attributes: [brand, model, volume, color, power]
  washing_machine:
    title: Стиральная машина
    label: Washing machine
    keywords: [стиральная машина, стиральная машинка]
    attributes: [brand, model, load, spin_speed, color, power]
  vacuum:
    title: Пылесос
    label: Vacuum cleaner
    keywords: [пылесос, робот-пылесос]
    attributes: [brand, model, power, color, battery]
  generic:
    title: Другое
    label: Other
    keywords: []
    attributes: [brand, model, color]

attributes:
  brand:
    title: Бренд
    label: Brand
    kind: brand
    dictionary: brands
    ask_model: always
    seller_keys: [бренд, производитель, марка, торговая марка, brand, vendor]
  model:
    title: Модель
    label: Model
    kind: model
    ask_model: always
    seller_keys: [модель, название модели, model]
  storage:
    title: Объём памяти
    label: Storage
    kind: memory
    format: { suffix: " ГБ", tb_suffix: " ТБ" }
    role: storage
    cues: [гб, gb, тб, tb]
    seller_keys: [встроенная память, объем встроенной памяти, объем памяти, память, накопитель, объем накопителя,
                  объем ssd, ssd, емкость накопителя, storage, rom]
  ram:
    title: Оперативная память
    label: RAM
    kind: memory
    format: { suffix: " ГБ", tb_suffix: " ТБ" }
    role: ram
    cues: [гб, gb]
    seller_keys: [оперативная память, объем оперативной памяти, озу, ram]
  screen_diagonal:
    title: Диагональ экрана
    label: Screen size
    kind: diagonal
    format: { suffix: '"' }
    cues: [дюйм, inch]
    ranges: { smartphone: [3, 8.5], tablet: [6, 15], laptop: [10, 21], tv: [15, 120], monitor: [15, 60], smartwatch: [0.9, 2.5] }
    in_code: [tv, monitor]   # categories whose model codes carry the size ("50P7K")
    seller_keys: [диагональ экрана, диагональ, размер экрана, экран, display]
  battery:
    title: Ёмкость батареи
    label: Battery capacity
    kind: battery
    cues: [мач, mah]
    ranges: { smartphone: [1000, 15000], tablet: [2500, 20000], smartwatch: [80, 1500] }
    format: { suffix: " мАч" }
    seller_keys: [емкость аккумулятора, емкость батареи, аккумулятор, батарея, battery]
  color:
    title: Цвет
    label: Color
    kind: color
    dictionary: colors
    seller_keys: [цвет, цвет товара, цвет корпуса, расцветка, color]
  resolution:
    title: Разрешение
    label: Resolution
    kind: resolution
    dictionary: resolutions
    seller_keys: [разрешение экрана, разрешение, формат экрана, resolution]
  cpu:
    title: Процессор
    label: Processor
    kind: pattern
    seller_keys: [процессор, модель процессора, cpu]
    patterns:
      - '(?:intel\s+)?core\s+(?:ultra\s+[3579]\s+\d{3}[a-z]{0,2}|i[3579][\s-]?\d{4,5}[a-z]{0,2}(?:\d[a-z]?)?|[3579]\s+\d{3}[a-z]{0,2})'
      - 'i[3579]-\d{4,5}[a-z]{0,2}(?:\d[a-z]?)?'
      - '(?:amd\s+)?ryzen\s+[3579][\s-]+(?:pro\s+)?\d{3,4}[a-z]{0,2}(?:\d[a-z]?)?'
      - '(?:amd\s+)?ryzen\s+ai\s+(?:[3579]|max\+?)\s+(?:hx\s+|pro\s+)?\d{3}'
      # Not a phone's model name: "POCO M5", "Galaxy M54", "Redmi M7" are not Apple chips.
      - '(?<!poco\s)(?<!galaxy\s)(?<!redmi\s)(?<!xiaomi\s)(?<!samsung\s)(?<!tecno\s)(?<![\p{L}\p{N}])(?:apple\s+)?m[1-9](?:\s+(?:pro|max|ultra))?(?![\p{L}\p{N}])'
      - '(?:intel\s+)?(?:celeron|pentium)\s+(?:silver\s+|gold\s+)?[nj]?\d{3,4}[a-z]?'
      - 'intel\s+(?:processor\s+)?n\d{2,3}'
      - 'snapdragon\s+(?:\d\s*gen\s*\d|x\s+(?:elite|plus)|\d{3})'
      - '(?:mediatek\s+)?(?:helio\s+[a-z]\d{2,3}|dimensity\s+\d{3,4})'
      - '(?:apple\s+a\d{1,2}(?:\s+(?:bionic|pro))?|a\d{1,2}\s+(?:bionic|pro))'
    # The family a processor belongs to, for labels that name only that ("Intel Core i7"); bin/learn notices them.
    families:
      - ['(?:intel\s+)?core\s+ultra\s+([3579])', 'Intel Core Ultra \1']
      - ['(?:intel\s+)?(?:core\s+)?i([3579])(?![\p{L}\p{N}])', 'Intel Core i\1']
      - ['(?:intel\s+)?core\s+([3579])(?![\p{L}\p{N}])', 'Intel Core \1']
      - ['(?:amd\s+)?ryzen\s+ai\s+([3579]|max)', 'AMD Ryzen AI \1']
      - ['(?:amd\s+)?ryzen\s+([3579])', 'AMD Ryzen \1']
      - ['(?:apple\s+)?m([1-9])((?:\s+(?:pro|max|ultra))?)', 'Apple M\1\2']
      - ['(?:intel\s+)?celeron', 'Intel Celeron']
      - ['(?:intel\s+)?pentium', 'Intel Pentium']
      - ['(?:qualcomm\s+)?snapdragon', 'Qualcomm Snapdragon']
      - ['(?:mediatek\s+)?helio', 'MediaTek Helio']
      - ['(?:mediatek\s+)?dimensity', 'MediaTek Dimensity']
  refresh_rate:
    title: Частота обновления
    label: Refresh rate
    kind: quantity
    units: [гц, hz]
    range: [30, 600]
    format: { suffix: " Гц" }
    seller_keys: [частота обновления, частота обновления экрана, частота развертки, refresh rate]
  screen_type:
    title: Тип матрицы
    label: Panel type
    kind: dictionary
    dictionary: screen_types
    seller_keys: [тип матрицы, матрица, тип экрана, технология экрана]
  connection:
    title: Тип подключения
    label: Connection type
    kind: dictionary
    dictionary: connections
    seller_keys: [тип подключения, подключение, тип наушников]
  volume:
    title: Объём
    label: Capacity
    kind: volume
    units: [л, литр, литра, литров, l]
    range: [20, 1000]
    format: { suffix: " л" }
    seller_keys: [общий объем, объем, полезный объем]
  load:
    title: Загрузка
    label: Load capacity
    kind: quantity
    units: [кг, kg]
    range: [2, 20]
    format: { suffix: " кг" }
    seller_keys: [максимальная загрузка, загрузка, загрузка белья]
  spin_speed:
    title: Скорость отжима
    label: Spin speed
    kind: quantity
    units: [об/мин, об./мин, об/минуту, об./минуту, оборотов, rpm]
    range: [300, 2000]
    format: { suffix: " об/мин" }
    seller_keys: [скорость отжима, максимальная скорость отжима, отжим]
  power:
    title: Мощность
    label: Power
    kind: power
    units: { вт: 1, w: 1, ватт: 1, квт: 1000, kw: 1000 }
    range: [5, 5000]
    format: { suffix: " Вт" }
    seller_keys: [мощность, потребляемая мощность, максимальная потребляемая мощность]
