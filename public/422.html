<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex">
  <script>var t = "dark"; try { t = localStorage.getItem("theme") || "dark"; } catch (e) {} if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;</script>
  <title>The page is outdated · Attrfill</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <style>
    :root { --bg:#f3f3f5; --panel:#fff; --ink:#1e1e1e; --muted:#6b6d76; --line:#e6e6ea; --brand:#e3111b; --brand-text:#bf0d16; color-scheme:light; }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#121215; --panel:#1c1c21; --ink:#ececf0; --muted:#a0a2ab; --line:#2f3037; --brand-text:#ff8a90; color-scheme:dark; } }
    :root[data-theme="dark"] { --bg:#121215; --panel:#1c1c21; --ink:#ececf0; --muted:#a0a2ab; --line:#2f3037; --brand-text:#ff8a90; color-scheme:dark; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100dvh; display:grid; place-items:center; padding:24px 16px; background:var(--bg); color:var(--ink);
           font:16px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; -webkit-font-smoothing:antialiased; }
    main { width:100%; max-width:34rem; background:var(--panel); border-radius:16px; padding:32px 28px;
           box-shadow:0 0 0 1px var(--line),0 4px 16px rgb(16 16 20 / 6%); }
    .logo { display:inline-flex; align-items:center; gap:10px; font-weight:700; color:inherit; text-decoration:none; }
    .logo img { width:36px; height:36px; }
    .code { margin:28px 0 0; font-size:14px; font-weight:600; color:var(--brand-text); letter-spacing:.04em; }
    h1 { margin:6px 0 0; font-size:26px; line-height:1.25; letter-spacing:-.01em; text-wrap:balance; }
    p { margin:12px 0 0; color:var(--muted); }
    ul { margin:12px 0 0; padding-left:20px; color:var(--muted); }
    .actions { display:flex; flex-wrap:wrap; gap:8px; margin-top:24px; }
    a.btn, button.btn { display:inline-flex; align-items:center; min-height:44px; padding:10px 18px; border-radius:12px; border:0;
           font-weight:600; font-size:15px; line-height:1.2; font-family:inherit; text-decoration:none; cursor:pointer; }
    .primary { background:var(--brand); color:#fff; }
    .secondary { background:var(--bg); color:var(--ink); }
    :focus-visible { outline:2px solid #f5222d; outline-offset:2px; }
  </style>
</head>
<body>
  <main>
    <a class="logo" href="/"><img src="/icon.svg" alt=""> Attrfill</a>
    <p class="code">Error 422</p>
    <h1>The page is outdated</h1>
    <p>The action was not saved: the page had been open for too long. Reload it and try again.</p>
    <div class="actions"><button class="btn primary" type="button" onclick="history.back()">Go back and retry</button><a class="btn secondary" href="/">Go to the home page</a></div>
  </main>
</body>
</html>
